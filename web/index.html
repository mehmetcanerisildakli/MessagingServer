<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slack Benzeri Mesajlaşma</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            height: 100vh;
            display: flex;
            background: #f8f9fa;
        }
        .sidebar {
            width: 250px;
            background: #4a154b;
            color: white;
            display: flex;
            flex-direction: column;
        }
        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .sidebar-header h2 {
            font-size: 20px;
        }
        .user-info {
            padding: 15px 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            font-size: 14px;
        }
        .user-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px 0;
        }
        .user-item {
            padding: 10px 20px;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
        }
        .user-item:hover {
            background: rgba(255,255,255,0.1);
        }
        .user-item.active {
            background: rgba(255,255,255,0.2);
        }
        .user-status {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 8px;
        }
        .user-status.online {
            background: #2eb886;
        }
        .user-status.offline {
            background: #999;
        }
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .header {
            background: white;
            padding: 15px 20px;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 {
            font-size: 18px;
            color: #333;
        }
        .connection-status {
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 12px;
        }
        .connection-status.connected {
            background: #d4edda;
            color: #155724;
        }
        .connection-status.disconnected {
            background: #f8d7da;
            color: #721c24;
        }
        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: white;
        }
        .message {
            margin-bottom: 15px;
            display: flex;
        }
        .message.own {
            flex-direction: row-reverse;
        }
        .message-avatar {
            width: 36px;
            height: 36px;
            border-radius: 4px;
            background: #4a154b;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            margin: 0 10px;
            flex-shrink: 0;
        }
        .message-content {
            max-width: 60%;
            background: #f1f1f1;
            padding: 10px 15px;
            border-radius: 8px;
        }
        .message.own .message-content {
            background: #4a154b;
            color: white;
        }
        .message-header {
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 5px;
            color: #666;
        }
        .message.own .message-header {
            color: rgba(255,255,255,0.8);
        }
        .message-text {
            font-size: 14px;
            line-height: 1.4;
        }
        .message-time {
            font-size: 11px;
            color: #999;
            margin-top: 5px;
        }
        .message.own .message-time {
            color: rgba(255,255,255,0.7);
        }
        .system-message {
            text-align: center;
            color: #999;
            font-size: 12px;
            margin: 10px 0;
            font-style: italic;
        }
        .input-area {
            background: white;
            border-top: 1px solid #e0e0e0;
            padding: 15px 20px;
        }
        .input-controls {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }
        .input-controls select {
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        .input-controls input[type="text"] {
            flex: 1;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        .input-area input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }
        .input-area input[type="text"]:focus {
            outline: none;
            border-color: #4a154b;
        }
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }
        .btn-primary {
            background: #4a154b;
            color: white;
        }
        .btn-primary:hover {
            background: #5a1a5b;
        }
        .btn-primary:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .btn-secondary {
            background: #6c757d;
            color: white;
        }
        .btn-secondary:hover {
            background: #5a6268;
        }
        .login-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .login-box {
            background: white;
            padding: 30px;
            border-radius: 8px;
            width: 400px;
        }
        .login-box h2 {
            margin-bottom: 20px;
        }
        .login-box input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }
    </style>
</head>
<body>
<!-- Login Modal -->
<div id="loginModal" class="login-modal">
    <div class="login-box">
        <h2>Kullanıcı Adınızı Girin</h2>
        <input type="text" id="usernameInput" placeholder="Kullanıcı adı (örn: a, b, c)" maxlength="20">
        <button class="btn-primary" onclick="handleLogin()" style="width: 100%;">Bağlan</button>
    </div>
</div>

<!-- Sidebar -->
<div class="sidebar">
    <div class="sidebar-header">
        <h2>💬 Mesajlaşma</h2>
    </div>
    <div class="user-info">
        <div id="currentUser">Kullanıcı: -</div>
        <div id="currentUserId" style="font-size: 12px; color: rgba(255,255,255,0.7); margin-top: 5px;">ID: -</div>
    </div>
    <div class="user-list">
        <div style="padding: 10px 20px; font-size: 12px; color: rgba(255,255,255,0.7);">Online Kullanıcılar</div>
        <div id="usersList"></div>
    </div>
</div>

<!-- Main Content -->
<div class="main-content">
    <div class="header">
        <h1 id="chatTitle">Genel Sohbet</h1>
        <div id="connectionStatus" class="connection-status disconnected">Bağlantı Yok</div>
    </div>

    <div class="messages-container" id="messagesContainer"></div>

    <div class="input-area">
        <div class="input-controls">
            <select id="messageType">
                <option value="public">Genel Mesaj</option>
                <option value="private">Özel Mesaj</option>
            </select>
            <input type="text" id="targetUserInput" placeholder="Hedef kullanıcı ID (özel mesaj için)" style="display: none;">
        </div>
        <input type="text" id="messageInput" placeholder="Mesajınızı yazın..." disabled>
        <div class="button-group">
            <button class="btn-primary" id="sendBtn" onclick="sendMessage()" disabled>Gönder</button>
            <button class="btn-secondary" id="disconnectBtn" onclick="disconnect()" disabled>Bağlantıyı Kes</button>
        </div>
    </div>
</div>

<script>
    let ws = null;
    let currentUserId = null;
    let currentUsername = null;
    let users = {};

    // DOM Elements
    const loginModal = document.getElementById('loginModal');
    const usernameInput = document.getElementById('usernameInput');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');
    const disconnectBtn = document.getElementById('disconnectBtn');
    const messagesContainer = document.getElementById('messagesContainer');
    const connectionStatus = document.getElementById('connectionStatus');
    const currentUserDiv = document.getElementById('currentUser');
    const currentUserIdDiv = document.getElementById('currentUserId');
    const usersListDiv = document.getElementById('usersList');
    const messageTypeSelect = document.getElementById('messageType');
    const targetUserInput = document.getElementById('targetUserInput');
    const chatTitle = document.getElementById('chatTitle');

    // Message type değiştiğinde
    messageTypeSelect.addEventListener('change', function() {
        if (this.value === 'private') {
            targetUserInput.style.display = 'block';
            chatTitle.textContent = 'Özel Mesaj';
        } else {
            targetUserInput.style.display = 'none';
            chatTitle.textContent = 'Genel Sohbet';
        }
    });

    // Login handler
    function handleLogin() {
        const username = usernameInput.value.trim();
        if (!username) {
            alert('Lütfen bir kullanıcı adı girin!');
            return;
        }
        currentUsername = username;
        loginModal.style.display = 'none';
        connect();
    }

    // Enter tuşu ile login
    usernameInput.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            handleLogin();
        }
    });

    // Connect
    function connect() {
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsUrl = `${protocol}//${window.location.host}/ws?username=${encodeURIComponent(currentUsername)}`;

        ws = new WebSocket(wsUrl);

        ws.onopen = function() {
            addSystemMessage('Bağlantı kuruldu!');
            updateConnectionStatus(true);
            messageInput.disabled = false;
            sendBtn.disabled = false;
            disconnectBtn.disabled = false;
        };

        ws.onmessage = function(event) {
            try {
                const message = JSON.parse(event.data);
                handleIncomingMessage(message);
            } catch (e) {
                // Eğer JSON değilse, eski format olabilir
                addSystemMessage(`Sunucu: ${event.data}`);
            }
        };

        ws.onerror = function(error) {
            addSystemMessage('Bağlantı hatası oluştu!');
        };

        ws.onclose = function() {
            addSystemMessage('Bağlantı kapatıldı.');
            updateConnectionStatus(false);
            messageInput.disabled = true;
            sendBtn.disabled = true;
            disconnectBtn.disabled = false;
            ws = null;
        };
    }

    // Disconnect
    function disconnect() {
        if (ws) {
            ws.close();
        }
    }

    // Send message
    function sendMessage() {
        const content = messageInput.value.trim();
        if (!content || !ws || ws.readyState !== WebSocket.OPEN) {
            return;
        }

        const messageType = messageTypeSelect.value;
        const message = {
            type: messageType,
            content: content,
            target: messageType === 'private' ? targetUserInput.value.trim() : undefined
        };

        ws.send(JSON.stringify(message));
        messageInput.value = '';

        // Özel mesaj gönderildiyse target input'u temizle
        if (messageType === 'private') {
            targetUserInput.value = '';
        }
    }

    // Handle incoming message
    function handleIncomingMessage(msg) {
        if (msg.type === 'status') {
            addSystemMessage(msg.content);
            // Hoş geldin mesajından kullanıcı ID'sini al
            if (msg.content.includes('Hoş geldin')) {
                currentUserId = msg.sender;
                currentUserDiv.textContent = `Kullanıcı: ${currentUsername}`;
                currentUserIdDiv.textContent = `ID: ${currentUserId}`;
            }
        } else if (msg.type === 'control' && msg.content.startsWith('[')) {
            // Kullanıcı listesi
            try {
                const usersList = JSON.parse(msg.content);
                updateUserList(usersList);
            } catch (e) {
                console.error('Kullanıcı listesi parse edilemedi:', e);
            }
        } else if (msg.type === 'public' || msg.type === 'private') {
            const isOwn = msg.sender === currentUserId;
            addMessage(msg, isOwn);
        }
    }

    // Update user list
    function updateUserList(usersList) {
        users = {};
        usersListDiv.innerHTML = '';

        usersList.forEach(user => {
            users[user.id] = user;
            const userDiv = document.createElement('div');
            userDiv.className = 'user-item';
            if (user.id === currentUserId) {
                userDiv.classList.add('active');
            }
            userDiv.innerHTML = `
                    <span class="user-status ${user.is_active ? 'online' : 'offline'}"></span>
                    ${user.username}
                `;
            userDiv.onclick = () => {
                if (user.id !== currentUserId) {
                    messageTypeSelect.value = 'private';
                    targetUserInput.value = user.id;
                    targetUserInput.style.display = 'block';
                    chatTitle.textContent = `${user.username} ile Özel Mesaj`;
                }
            };
            usersListDiv.appendChild(userDiv);
        });
    }

    // Add message to UI
    function addMessage(msg, isOwn = false) {
        const messageDiv = document.createElement('div');
        messageDiv.className = `message ${isOwn ? 'own' : ''}`;

        const avatar = document.createElement('div');
        avatar.className = 'message-avatar';
        avatar.textContent = (msg.sender_name || msg.sender || 'U').charAt(0).toUpperCase();

        const content = document.createElement('div');
        content.className = 'message-content';

        const header = document.createElement('div');
        header.className = 'message-header';
        header.textContent = msg.sender_name || `User ${msg.sender}`;

        const text = document.createElement('div');
        text.className = 'message-text';
        text.textContent = msg.content;

        const time = document.createElement('div');
        time.className = 'message-time';
        if (msg.timestamp) {
            const date = new Date(msg.timestamp);
            time.textContent = date.toLocaleTimeString('tr-TR');
        } else {
            time.textContent = new Date().toLocaleTimeString('tr-TR');
        }

        content.appendChild(header);
        content.appendChild(text);
        content.appendChild(time);

        messageDiv.appendChild(avatar);
        messageDiv.appendChild(content);

        messagesContainer.appendChild(messageDiv);
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    // Add system message
    function addSystemMessage(text) {
        const div = document.createElement('div');
        div.className = 'system-message';
        div.textContent = text;
        messagesContainer.appendChild(div);
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    // Update connection status
    function updateConnectionStatus(connected) {
        if (connected) {
            connectionStatus.textContent = 'Bağlı';
            connectionStatus.className = 'connection-status connected';
        } else {
            connectionStatus.textContent = 'Bağlantı Yok';
            connectionStatus.className = 'connection-status disconnected';
        }
    }

    // Enter tuşu ile mesaj gönder
    messageInput.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            sendMessage();
        }
    });
</script>
</body>
</html>
